name: DNS Block&Redirect Configurer cron task

on:
  schedule:
    - cron: '17 */2 * * *' # Every two hours; GitHub may delay scheduled runs.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: DNS

    env:
      DNS: ${{ vars.DNS }}
      BLOCK: ${{ vars.BLOCK }}
      REDIRECT: ${{ vars.REDIRECT }}
      EXCLUDE_REDIRECT: ${{ vars.EXCLUDE_REDIRECT }}
      DONOR_DNS: ${{ vars.DONOR_DNS }}

      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      TZ: Europe/Moscow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Select a healthy OpenAI proxy
        id: openai_proxy
        run: bash .github/scripts/select-openai-proxy.sh config/openai.hosts

      - name: Run application
        run: |
          echo "Starting application..."
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >/tmp/dnsconf-http.log 2>&1 &
          IFS=',' read -ra redirect_sources <<< "$REDIRECT"
          source_replaced=false
          for index in "${!redirect_sources[@]}"; do
            if [[ "${redirect_sources[$index]}" == */config/openai.hosts ]]; then
              redirect_sources[$index]="http://127.0.0.1:8765/config/openai.hosts"
              source_replaced=true
            fi
          done
          if [[ "$source_replaced" != true ]]; then
            echo "OpenAI hosts source was not found in REDIRECT" >&2
            exit 1
          fi
          export REDIRECT="$(IFS=','; echo "${redirect_sources[*]}")"
          java --enable-preview -jar target/*.jar
